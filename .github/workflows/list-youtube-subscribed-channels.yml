name: List Subscribed YouTube Channels

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      max_results:
        description: "How many subscribed channels to list"
        required: true
        default: "100"
        type: choice
        options:
          - "50"
          - "100"
          - "200"
      sort_by:
        description: "Sort output channels"
        required: true
        default: "latest_upload"
        type: choice
        options:
          - "latest_upload"
          - "channel_name"
          - "channel_id"
      release_name:
        description: "Optional release title"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  list_channels:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAX_RESULTS: ${{ github.event.inputs.max_results || '100' }}
      SORT_BY: ${{ github.event.inputs.sort_by || 'latest_upload' }}
      RELEASE_NAME: ${{ github.event.inputs.release_name || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup Node.js (YouTube JS runtime)
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Prepare required cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -euo pipefail
          if [ -n "${YT_COOKIES:-}" ]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
            echo "Cookies file detected and prepared."
          else
            echo "YT_COOKIES is required for subscriptions data."
            exit 1
          fi

      - name: Build subscribed channels list
        env:
          SCAN_LIMIT: "500"
        run: |
          set -euo pipefail
          python scripts/list_subscribed_channels.py

      - name: Build release notes
        id: notes
        run: |
          set -euo pipefail
          TAG="subscribed-channels-$(date -u +'%Y%m%d-%H%M%S')"
          {
            echo "# Subscribed Channels"
            echo
            echo "- Requested channels: ${MAX_RESULTS}"
            echo "- Sort: ${SORT_BY}"
            echo "- Source: https://www.youtube.com/feed/channels"
            echo "- Source: https://www.youtube.com/feed/subscriptions"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            if [ -f subscribed_channels.md ]; then
              cat subscribed_channels.md
            else
              echo "- No subscribed channels list generated."
            fi
          } > release_notes.md
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ env.RELEASE_NAME != '' && env.RELEASE_NAME || steps.notes.outputs.tag }}
          body_path: release_notes.md
          files: |
            subscribed_channels.json
            subscribed_channels.md
            subscribed_channels.txt

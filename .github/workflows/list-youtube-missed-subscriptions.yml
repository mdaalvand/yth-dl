name: List Missed Subscription Videos

on:
  workflow_dispatch:
    inputs:
      max_results:
        description: "How many missed videos to list"
        required: true
        default: "50"
        type: choice
        options:
          - "20"
          - "50"
          - "100"
      missed_after_days:
        description: "Consider videos as missed if age is at least this many days"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "7"
          - "14"
      sort_by:
        description: "Sort missed videos"
        required: true
        default: "upload_date"
        type: choice
        options:
          - "upload_date"
          - "view_count"
          - "channel_name"
      release_name:
        description: "Optional release title"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  list_missed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAX_RESULTS: ${{ github.event.inputs.max_results || '50' }}
      MISSED_AFTER_DAYS: ${{ github.event.inputs.missed_after_days || '1' }}
      SORT_BY: ${{ github.event.inputs.sort_by || 'upload_date' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup Node.js (YouTube JS runtime)
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Set Release Name
        id: release_meta
        run: |
          set -euo pipefail
          release_stamp="$(date -u +'%Y-%m-%d %H-%M-%S UTC')"
          custom_release_name="${{ github.event.inputs.release_name }}"
          if [ -n "$custom_release_name" ]; then
            release_name="${release_stamp} - ${custom_release_name}"
          else
            release_name="${release_stamp} - List Missed Subscription Videos"
          fi
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"

      - name: Prepare required cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -euo pipefail
          if [ -n "${YT_COOKIES:-}" ]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
            echo "Cookies file detected and prepared."
          else
            echo "YT_COOKIES is required for subscriptions data."
            exit 1
          fi

      - name: Build missed videos list
        env:
          SCAN_LIMIT: "500"
        run: |
          set -euo pipefail
          python scripts/list_missed_subscriptions.py

      - name: Build release notes
        id: notes
        run: |
          set -euo pipefail
          TAG="missed-subscriptions-$(date -u +'%Y%m%d-%H%M%S')"
          {
            echo "# Missed Subscription Videos"
            echo
            echo "- Requested videos: ${MAX_RESULTS}"
            echo "- Missed threshold (days): ${MISSED_AFTER_DAYS}"
            echo "- Sort: ${SORT_BY}"
            echo "- Source: https://www.youtube.com/feed/subscriptions"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            if [ -f missed_subscription_videos.md ]; then
              cat missed_subscription_videos.md
            else
              echo "- No missed videos list generated."
            fi
          } > release_notes.md
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.release_meta.outputs.release_name }}
          body_path: release_notes.md
          files: |
            missed_subscription_videos.json
            missed_subscription_videos.md
            missed_subscription_videos.txt

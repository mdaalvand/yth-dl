name: Download Home Recommended YouTube Videos

on:
  workflow_dispatch:
    inputs:
      max_results:
        description: "How many home-recommended videos to download"
        required: true
        default: "20"
        type: choice
        options:
          - "10"
          - "20"
          - "30"
      sort_by:
        description: "Sort recommended candidates before selecting"
        required: true
        default: "feed_order"
        type: choice
        options:
          - "feed_order"
          - "upload_date"
          - "view_count"
          - "duration"
          - "title"
      selection_mode:
        description: "How to pick final videos after sorting"
        required: true
        default: "sorted"
        type: choice
        options:
          - "sorted"
          - "random"
          - "mixed"
      quality:
        description: "Target quality (closest available)"
        required: true
        default: "480"
        type: choice
        options:
          - "144"
          - "240"
          - "360"
          - "480"
          - "720"
          - "1080"
      embed_subtitles:
        description: "Embed subtitles into output video"
        required: true
        default: true
        type: boolean
      embed_chapters:
        description: "Embed chapters into output video"
        required: true
        default: true
        type: boolean
      subtitle_langs:
        description: "Subtitle languages for yt-dlp --sub-langs"
        required: true
        default: "fa.*,en.*,fa,en"
        type: string
      release_name:
        description: "Optional release title"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  recommended_download:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup Node.js (YouTube JS runtime)
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Prepare optional cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -euo pipefail
          if [ -n "${YT_COOKIES:-}" ]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
            echo "Cookies file detected and prepared."
          else
            echo "YT_COOKIES is required for personalized home recommendations."
            exit 1
          fi

      - name: Download recommended videos
        env:
          MAX_RESULTS: ${{ github.event.inputs.max_results }}
          RECOMMENDED_SORT_BY: ${{ github.event.inputs.sort_by }}
          RECOMMENDED_SELECTION_MODE: ${{ github.event.inputs.selection_mode }}
          QUALITY: ${{ github.event.inputs.quality }}
          EMBED_SUBTITLES: ${{ github.event.inputs.embed_subtitles }}
          EMBED_CHAPTERS: ${{ github.event.inputs.embed_chapters }}
          SUBTITLE_LANGS: ${{ github.event.inputs.subtitle_langs }}
          MAX_429_RETRIES: "4"
          RETRY_BASE_SLEEP_SECONDS: "15"
          PER_VIDEO_TIMEOUT_SECONDS: "900"
          CONTINUE_ON_ERROR: "true"
        run: |
          set -euo pipefail
          python scripts/download_recommended_videos.py

      - name: Build release notes
        id: notes
        env:
          MAX_RESULTS: ${{ github.event.inputs.max_results }}
          RECOMMENDED_SORT_BY: ${{ github.event.inputs.sort_by }}
          RECOMMENDED_SELECTION_MODE: ${{ github.event.inputs.selection_mode }}
          QUALITY: ${{ github.event.inputs.quality }}
          EMBED_SUBTITLES: ${{ github.event.inputs.embed_subtitles }}
          EMBED_CHAPTERS: ${{ github.event.inputs.embed_chapters }}
          SUBTITLE_LANGS: ${{ github.event.inputs.subtitle_langs }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -euo pipefail

          TAG="recommended-download-$(date -u +'%Y%m%d-%H%M%S')"
          {
            echo "# Home Recommended Download Results"
            echo
            echo "- Source: https://www.youtube.com/feed/recommended (personalized by your cookies)"
            echo "- Requested recommendations: ${MAX_RESULTS}"
            echo "- Candidate sort: ${RECOMMENDED_SORT_BY}"
            echo "- Selection mode: ${RECOMMENDED_SELECTION_MODE}"
            echo "- Quality target: ${QUALITY}p"
            echo "- Subtitles embedded: ${EMBED_SUBTITLES}"
            echo "- Subtitle langs: ${SUBTITLE_LANGS}"
            echo "- Chapters embedded: ${EMBED_CHAPTERS}"
            if [ -n "${YT_COOKIES:-}" ]; then
              echo "- Cookies provided: true"
            else
              echo "- Cookies provided: false"
            fi
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## Recommended List"
            if [ -f recommended_videos.md ]; then
              cat recommended_videos.md
            else
              echo "- No recommended list generated."
            fi
            if [ -f downloads_failed.json ]; then
              failed_count="$(jq -r '.failed_count // 0' downloads_failed.json)"
              echo
              echo "## Failed Videos"
              echo "- Failed count: ${failed_count}"
            fi
          } > release_notes.md

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Remove empty files before release upload
        shell: bash
        run: |
          set -e
          if [ -d downloads ]; then
            find downloads -type f -size 0 -delete || true
          fi
          true

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || steps.notes.outputs.tag }}
          body_path: release_notes.md
          files: |
            downloads/*.mp4
          fail_on_unmatched_files: false

      - name: Finalize release notes from actual assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.notes.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["TAG"]
          token = os.environ["GH_TOKEN"]

          def api(path: str, method: str = "GET", data: dict | None = None):
            url = f"https://api.github.com{path}"
            body = None if data is None else json.dumps(data).encode("utf-8")
            req = urllib.request.Request(url, data=body, method=method)
            req.add_header("Authorization", f"Bearer {token}")
            req.add_header("Accept", "application/vnd.github+json")
            req.add_header("X-GitHub-Api-Version", "2022-11-28")
            if body is not None:
              req.add_header("Content-Type", "application/json")
            with urllib.request.urlopen(req, timeout=30) as resp:
              return json.loads(resp.read().decode("utf-8"))

          release = api(f"/repos/{repo}/releases/tags/{tag}")
          assets = [a for a in release.get("assets", []) if a.get("name", "").lower().endswith(".mp4")]
          assets.sort(key=lambda a: a.get("name", ""))

          body = release.get("body", "").rstrip() + "\n\n## Downloaded Files\n"
          if assets:
            for a in assets:
              size_mb = int(a.get("size", 0)) / (1024 * 1024)
              body += f"- [{a['name']}]({a['browser_download_url']}) ({size_mb:.1f} MB)\n"
          else:
            body += "- No video files were produced.\n"

          api(f"/repos/{repo}/releases/{release['id']}", method="PATCH", data={"body": body})
          PY

name: Download Home Recommended YouTube Videos

on:
  workflow_dispatch:
    inputs:
      max_results:
        description: "How many home-recommended videos to download"
        required: true
        default: "20"
        type: choice
        options:
          - "10"
          - "20"
          - "30"
      quality:
        description: "Target quality (closest available)"
        required: true
        default: "480"
        type: choice
        options:
          - "144"
          - "240"
          - "360"
          - "480"
          - "720"
          - "1080"
      embed_subtitles:
        description: "Embed subtitles into output video"
        required: true
        default: true
        type: boolean
      embed_chapters:
        description: "Embed chapters into output video"
        required: true
        default: true
        type: boolean
      subtitle_langs:
        description: "Subtitle languages for yt-dlp --sub-langs"
        required: true
        default: "fa.*,en.*,fa,en"
        type: string
      release_name:
        description: "Optional release title"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  recommended_download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup Node.js (YouTube JS runtime)
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Prepare optional cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -euo pipefail
          if [ -n "${YT_COOKIES:-}" ]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
            echo "Cookies file detected and prepared."
          else
            echo "YT_COOKIES is required for personalized home recommendations."
            exit 1
          fi

      - name: Download recommended videos
        env:
          MAX_RESULTS: ${{ github.event.inputs.max_results }}
          QUALITY: ${{ github.event.inputs.quality }}
          EMBED_SUBTITLES: ${{ github.event.inputs.embed_subtitles }}
          EMBED_CHAPTERS: ${{ github.event.inputs.embed_chapters }}
          SUBTITLE_LANGS: ${{ github.event.inputs.subtitle_langs }}
          MAX_429_RETRIES: "4"
          RETRY_BASE_SLEEP_SECONDS: "15"
          CONTINUE_ON_ERROR: "true"
        run: |
          set -euo pipefail
          python scripts/download_recommended_videos.py

      - name: Build release notes
        id: notes
        env:
          MAX_RESULTS: ${{ github.event.inputs.max_results }}
          QUALITY: ${{ github.event.inputs.quality }}
          EMBED_SUBTITLES: ${{ github.event.inputs.embed_subtitles }}
          EMBED_CHAPTERS: ${{ github.event.inputs.embed_chapters }}
          SUBTITLE_LANGS: ${{ github.event.inputs.subtitle_langs }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -euo pipefail

          TAG="recommended-download-$(date -u +'%Y%m%d-%H%M%S')"
          {
            echo "# Home Recommended Download Results"
            echo
            echo "- Source: https://www.youtube.com/feed/recommended (personalized by your cookies)"
            echo "- Requested recommendations: ${MAX_RESULTS}"
            echo "- Quality target: ${QUALITY}p"
            echo "- Subtitles embedded: ${EMBED_SUBTITLES}"
            echo "- Subtitle langs: ${SUBTITLE_LANGS}"
            echo "- Chapters embedded: ${EMBED_CHAPTERS}"
            if [ -n "${YT_COOKIES:-}" ]; then
              echo "- Cookies provided: true"
            else
              echo "- Cookies provided: false"
            fi
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## Recommended List"
            if [ -f recommended_videos.md ]; then
              cat recommended_videos.md
            else
              echo "- No recommended list generated."
            fi
            echo
            echo "## Downloaded Files"
            if ls downloads/* >/dev/null 2>&1; then
              for file in downloads/*; do
                size="$(du -h "$file" | cut -f1)"
                name="$(basename "$file")"
                echo "- ${name} (${size})"
              done
            else
              echo "- No files were produced."
            fi
            if [ -f downloads_failed.json ]; then
              failed_count="$(jq -r '.failed_count // 0' downloads_failed.json)"
              echo
              echo "## Failed Videos"
              echo "- Failed count: ${failed_count}"
            fi
          } > release_notes.md

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || steps.notes.outputs.tag }}
          body_path: release_notes.md
          files: |
            recommended_videos.txt
            recommended_videos.json
            recommended_videos.md
            downloads_failed.json
            downloads_failed.txt
            downloads/**

name: Download YouTube Videos

on:
  workflow_dispatch:
    inputs:
      video_inputs:
        description: "YouTube URLs or video IDs (comma/space/newline separated)"
        required: true
        type: string
      quality:
        description: "Max video quality (height)"
        required: true
        default: "480"
        type: choice
        options:
          - "144"
          - "240"
          - "360"
          - "480"
          - "720"
          - "1080"
      embed_subtitles:
        description: "Embed subtitles into output video"
        required: true
        default: true
        type: boolean
      embed_chapters:
        description: "Embed chapters into output video"
        required: true
        default: true
        type: boolean
      release_name:
        description: "Optional release title"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js (YouTube JS runtime)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Prepare optional cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -euo pipefail
          if [ -n "${YT_COOKIES:-}" ]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
            echo "Cookies file detected and prepared."
          else
            echo "No cookies secret provided; continuing without cookies."
          fi

      - name: Download videos
        env:
          VIDEO_INPUTS: ${{ github.event.inputs.video_inputs }}
          QUALITY: ${{ github.event.inputs.quality }}
          EMBED_SUBTITLES: ${{ github.event.inputs.embed_subtitles }}
          EMBED_CHAPTERS: ${{ github.event.inputs.embed_chapters }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -euo pipefail

          mkdir -p downloads

          INPUT_FILE="$(mktemp)"
          printf '%s\n' "$VIDEO_INPUTS" \
            | tr ',' '\n' \
            | tr ' ' '\n' \
            | sed '/^\s*$/d' > "$INPUT_FILE"

          if [ ! -s "$INPUT_FILE" ]; then
            echo "No valid video input found."
            exit 1
          fi

          while IFS= read -r RAW_ITEM; do
            ITEM="$(echo "$RAW_ITEM" | xargs)"
            [ -z "$ITEM" ] && continue

            if [[ "$ITEM" =~ ^https?:// ]]; then
              URL="$ITEM"
            else
              URL="https://www.youtube.com/watch?v=$ITEM"
            fi

            echo "Downloading: $URL"

            echo "Available formats for: $URL"
            LIST_ARGS=(
              --list-formats
              --no-playlist
              --js-runtimes node
              --remote-components ejs:github
              --extractor-args "youtube:player_client=web,android,ios,tv"
            )

            if [ -n "${YT_COOKIES:-}" ] && [ -f cookies.txt ]; then
              LIST_ARGS+=(--cookies cookies.txt)
            fi

            yt-dlp "${LIST_ARGS[@]}" "$URL" || true

            ARGS=(
              --no-playlist
              --restrict-filenames
              --merge-output-format mp4
              --js-runtimes node
              --remote-components ejs:github
              --extractor-args "youtube:player_client=web,android,ios,tv"
              --retries 10
              --fragment-retries 10
              --retry-sleep 2
              --sleep-requests 1
              --sleep-interval 1
              --max-sleep-interval 5
              --format "bv*+ba/b"
              --format-sort "res:${QUALITY}"
              --paths downloads
              --output "%(title).180B-%(id)s.%(ext)s"
            )

            if [ "$EMBED_SUBTITLES" = "true" ]; then
              ARGS+=(--write-subs --write-auto-subs --sub-langs "all,-live_chat" --embed-subs)
            fi

            if [ "$EMBED_CHAPTERS" = "true" ]; then
              ARGS+=(--add-metadata --embed-chapters)
            fi

            if [ -n "${YT_COOKIES:-}" ] && [ -f cookies.txt ]; then
              ARGS+=(--cookies cookies.txt)
            fi

            yt-dlp "${ARGS[@]}" "$URL" || {
              echo "Primary selection failed. Falling back to best available format..."
              FALLBACK_ARGS=(
                --no-playlist
                --restrict-filenames
                --merge-output-format mp4
                --js-runtimes node
                --remote-components ejs:github
                --extractor-args "youtube:player_client=web,android,ios,tv"
                --retries 10
                --fragment-retries 10
                --retry-sleep 2
                --paths downloads
                --output "%(title).180B-%(id)s.%(ext)s"
              )

              if [ "$EMBED_SUBTITLES" = "true" ]; then
                FALLBACK_ARGS+=(--write-subs --write-auto-subs --sub-langs "all,-live_chat" --embed-subs)
              fi

              if [ "$EMBED_CHAPTERS" = "true" ]; then
                FALLBACK_ARGS+=(--add-metadata --embed-chapters)
              fi

              if [ -n "${YT_COOKIES:-}" ] && [ -f cookies.txt ]; then
                FALLBACK_ARGS+=(--cookies cookies.txt)
              fi

              yt-dlp "${FALLBACK_ARGS[@]}" "$URL"
            }
          done < "$INPUT_FILE"

      - name: Build release notes
        id: notes
        env:
          QUALITY: ${{ github.event.inputs.quality }}
          EMBED_SUBTITLES: ${{ github.event.inputs.embed_subtitles }}
          EMBED_CHAPTERS: ${{ github.event.inputs.embed_chapters }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -euo pipefail

          TAG="download-$(date -u +'%Y%m%d-%H%M%S')"
          {
            echo "# YouTube Download Results"
            echo
            echo "- Quality limit: ${QUALITY}p"
            echo "- Subtitles embedded: ${EMBED_SUBTITLES}"
            echo "- Chapters embedded: ${EMBED_CHAPTERS}"
            if [ -n "${YT_COOKIES:-}" ]; then
              echo "- Cookies provided: true"
            else
              echo "- Cookies provided: false"
            fi
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## Output Files"
            if ls downloads/* >/dev/null 2>&1; then
              for file in downloads/*; do
                size="$(du -h "$file" | cut -f1)"
                name="$(basename "$file")"
                echo "- ${name} (${size})"
              done
            else
              echo "- No files were produced."
            fi
          } > release_notes.md

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || steps.notes.outputs.tag }}
          body_path: release_notes.md
          files: |
            downloads/**

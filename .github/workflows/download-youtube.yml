name: Download YouTube Videos

on:
  workflow_dispatch:
    inputs:
      video_inputs:
        description: "YouTube URLs or video IDs (comma/space/newline separated)"
        required: true
        type: string
      quality:
        description: "Max video quality (height)"
        required: true
        default: "480"
        type: choice
        options:
          - "144"
          - "240"
          - "360"
          - "480"
          - "720"
          - "1080"
      embed_subtitles:
        description: "Embed subtitles into output video"
        required: true
        default: true
        type: boolean
      embed_chapters:
        description: "Embed chapters into output video"
        required: true
        default: true
        type: boolean
      subtitle_langs:
        description: "Subtitle languages for yt-dlp --sub-langs"
        required: true
        default: "fa.*,en.*,fa,en"
        type: string
      release_name:
        description: "Optional release title"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Setup Node.js (YouTube JS runtime)
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq

      - name: Prepare optional cookies
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -euo pipefail
          if [ -n "${YT_COOKIES:-}" ]; then
            printf '%s\n' "$YT_COOKIES" > cookies.txt
            echo "Cookies file detected and prepared."
          else
            echo "No cookies secret provided; continuing without cookies."
          fi

      - name: Download videos
        env:
          VIDEO_INPUTS: ${{ github.event.inputs.video_inputs }}
          QUALITY: ${{ github.event.inputs.quality }}
          EMBED_SUBTITLES: ${{ github.event.inputs.embed_subtitles }}
          EMBED_CHAPTERS: ${{ github.event.inputs.embed_chapters }}
          SUBTITLE_LANGS: ${{ github.event.inputs.subtitle_langs }}
          MAX_429_RETRIES: "4"
          RETRY_BASE_SLEEP_SECONDS: "15"
          PER_VIDEO_TIMEOUT_SECONDS: "900"
          CONTINUE_ON_ERROR: "true"
        run: |
          set -euo pipefail
          python scripts/download_videos.py

      - name: Build release notes
        id: notes
        env:
          QUALITY: ${{ github.event.inputs.quality }}
          EMBED_SUBTITLES: ${{ github.event.inputs.embed_subtitles }}
          SUBTITLE_LANGS: ${{ github.event.inputs.subtitle_langs }}
          EMBED_CHAPTERS: ${{ github.event.inputs.embed_chapters }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          set -euo pipefail

          TAG="download-$(date -u +'%Y%m%d-%H%M%S')"
          {
            echo "# YouTube Download Results"
            echo
            echo "- Quality limit: ${QUALITY}p"
            echo "- Subtitles embedded: ${EMBED_SUBTITLES}"
            echo "- Subtitle langs: ${SUBTITLE_LANGS}"
            echo "- Chapters embedded: ${EMBED_CHAPTERS}"
            if [ -n "${YT_COOKIES:-}" ]; then
              echo "- Cookies provided: true"
            else
              echo "- Cookies provided: false"
            fi
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo "## Downloaded Files"
            if compgen -G "downloads/*.mp4" > /dev/null; then
              for file in downloads/*.mp4; do
                size="$(du -h "$file" | cut -f1)"
                name="$(basename "$file")"
                echo "- ${name} (${size})"
              done
            else
              echo "- No video files were produced."
            fi
            if [ -f downloads_failed.json ]; then
              failed_count="$(jq -r '.failed_count // 0' downloads_failed.json)"
              echo
              echo "## Failed Videos"
              echo "- Failed count: ${failed_count}"
            fi
          } > release_notes.md

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Remove empty files before release upload
        shell: bash
        run: |
          set -e
          if [ -d downloads ]; then
            find downloads -type f -size 0 -delete || true
          fi
          true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ github.event.inputs.release_name != '' && github.event.inputs.release_name || steps.notes.outputs.tag }}
          body_path: release_notes.md
          files: |
            downloads/*.mp4
          fail_on_unmatched_files: false
